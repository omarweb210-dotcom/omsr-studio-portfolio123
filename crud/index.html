<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المنتجات - CRUD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Roboto", sans-serif;
            background: linear-gradient(135deg, #051457 0%, #5f0db2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .form-section {
            border-right: 5px solid #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 1.1rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
            margin: 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: right;
            border-bottom: 1px solid #eee;
        }

        th {
            background: linear-gradient(135deg, #2548e7 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 0.9rem;
        }

        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: scale(1.05);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }

        .price-tag {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .category-badge {
            background: #e3f2fd;
            color: #1976d2;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .card {
                padding: 20px;
            }
            
            th, td {
                padding: 10px;
                font-size: 0.9rem;
            }
            
            .actions {
                flex-direction: column;
            }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            display: none;
            animation: slideUp 0.3s ease;
            z-index: 2000;
        }

        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        .toast.success {
            background: #11998e;
        }

        .toast.error {
            background: #eb3349;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛍️ نظام إدارة المنتجات</h1>

        <!-- إحصائيات -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalProducts">0</div>
                <div class="stat-label">إجمالي المنتجات</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalValue">0</div>
                <div class="stat-label">القيمة الإجمالية</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgPrice">0</div>
                <div class="stat-label">متوسط السعر</div>
            </div>
        </div>

        <!-- نموذج الإضافة -->
        <div class="card form-section">
            <h2 style="margin-bottom: 20px; color: #667eea;">➕ إضافة منتج جديد</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                    <div class="form-group">
                        <label for="productName">اسم المنتج *</label>
                        <input type="text" id="productName" required placeholder="أدخل اسم المنتج">
                    </div>
                    <div class="form-group">
                        <label for="productPrice">السعر *</label>
                        <input type="number" id="productPrice" required min="0" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="productCategory">الفئة *</label>
                        <select id="productCategory" required>
                            <option value="">اختر الفئة</option>
                            <option value="إلكترونيات">إلكترونيات</option>
                            <option value="ملابس">ملابس</option>
                            <option value="أغذية">أغذية</option>
                            <option value="أثاث">أثاث</option>
                            <option value="أخرى">أخرى</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="productStock">الكمية *</label>
                        <input type="number" id="productStock" required min="0" placeholder="0">
                    </div>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label for="productDescription">الوصف</label>
                    <textarea id="productDescription" placeholder="وصف المنتج (اختياري)"></textarea>
                </div>
                <div style="margin-top: 20px;">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        💾 حفظ المنتج
                    </button>
                    <button type="button" class="btn btn-warning" onclick="resetForm()" style="display: none;" id="cancelBtn">
                        ❌ إلغاء
                    </button>
                </div>
            </form>
        </div>

        <!-- البحث -->
        <div class="card">
            <h2 style="margin-bottom: 20px; color: #667eea;">🔍 البحث والفلترة</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن منتج..." onkeyup="searchProducts()">
                <select id="filterCategory" onchange="filterByCategory()">
                    <option value="">جميع الفئات</option>
                    <option value="إلكترونيات">إلكترونيات</option>
                    <option value="ملابس">ملابس</option>
                    <option value="أغذية">أغذية</option>
                    <option value="أثاث">أثاث</option>
                    <option value="أخرى">أخرى</option>
                </select>
                <button class="btn btn-success" onclick="exportData()">📥 تصدير البيانات</button>
            </div>
        </div>

        <!-- جدول المنتجات -->
        <div class="card">
            <h2 style="margin-bottom: 20px; color: #667eea;">📋 قائمة المنتجات</h2>
            <div class="table-container">
                <table id="productsTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>المنتج</th>
                            <th>الفئة</th>
                            <th>السعر</th>
                            <th>الكمية</th>
                            <th>القيمة</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="productsList">
                        <!-- سيتم ملؤها بالJavaScript -->
                    </tbody>
                </table>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                    </svg>
                    <h3>لا توجد منتجات</h3>
                    <p>ابدأ بإضافة منتج جديد</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal تأكيد الحذف -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚠️ تأكيد الحذف</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <p>هل أنت متأكد من حذف هذا المنتج؟ لا يمكن التراجع عن هذا الإجراء.</p>
            <div style="margin-top: 20px; text-align: left;">
                <button class="btn btn-danger" onclick="confirmDelete()">🗑️ نعم، احذف</button>
                <button class="btn btn-warning" onclick="closeModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script>
        // متغيرات عامة
        let products = JSON.parse(localStorage.getItem('products')) || [];
        let deleteId = null;
        let isEditing = false;

        // تحميل البيانات عند بدء التطبيق
        document.addEventListener('DOMContentLoaded', function() {
            renderProducts();
            updateStats();
        });

        // إضافة/تحديث منتج
        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const productData = {
                id: document.getElementById('productId').value || Date.now().toString(),
                name: document.getElementById('productName').value,
                price: parseFloat(document.getElementById('productPrice').value),
                category: document.getElementById('productCategory').value,
                stock: parseInt(document.getElementById('productStock').value),
                description: document.getElementById('productDescription').value,
                createdAt: new Date().toISOString()
            };

            if (isEditing) {
                const index = products.findIndex(p => p.id === productData.id);
                products[index] = productData;
                showToast('تم تحديث المنتج بنجاح!', 'success');
            } else {
                products.push(productData);
                showToast('تم إضافة المنتج بنجاح!', 'success');
            }

            saveProducts();
            renderProducts();
            updateStats();
            resetForm();
        });

        // عرض المنتجات
        function renderProducts(productsToRender = products) {
            const tbody = document.getElementById('productsList');
            const emptyState = document.getElementById('emptyState');
            
            if (productsToRender.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            tbody.innerHTML = productsToRender.map((product, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>
                        <strong>${product.name}</strong>
                        ${product.description ? `<br><small style="color: #666;">${product.description}</small>` : ''}
                    </td>
                    <td><span class="category-badge">${product.category}</span></td>
                    <td><span class="price-tag">${product.price.toFixed(2)} ر.س</span></td>
                    <td>${product.stock}</td>
                    <td>${(product.price * product.stock).toFixed(2)} ر.س</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-success btn-small" onclick="editProduct('${product.id}')">✏️ تعديل</button>
                            <button class="btn btn-danger btn-small" onclick="deleteProduct('${product.id}')">🗑️ حذف</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // تعديل منتج
        function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            document.getElementById('productId').value = product.id;
            document.getElementById('productName').value = product.name;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productCategory').value = product.category;
            document.getElementById('productStock').value = product.stock;
            document.getElementById('productDescription').value = product.description || '';

            document.getElementById('submitBtn').textContent = '💾 تحديث المنتج';
            document.getElementById('cancelBtn').style.display = 'inline-block';
            
            isEditing = true;
            
            // التمرير إلى النموذج
            document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
        }

        // حذف منتج
        function deleteProduct(id) {
            deleteId = id;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function confirmDelete() {
            if (deleteId) {
                products = products.filter(p => p.id !== deleteId);
                saveProducts();
                renderProducts();
                updateStats();
                showToast('تم حذف المنتج بنجاح!', 'success');
                closeModal();
            }
        }

        function closeModal() {
            document.getElementById('deleteModal').style.display = 'none';
            deleteId = null;
        }

        // إعادة تعيين النموذج
        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('submitBtn').textContent = '💾 حفظ المنتج';
            document.getElementById('cancelBtn').style.display = 'none';
            isEditing = false;
        }

        // البحث
        function searchProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(searchTerm) ||
                p.category.toLowerCase().includes(searchTerm) ||
                p.description.toLowerCase().includes(searchTerm)
            );
            renderProducts(filtered);
        }

        // فلترة حسب الفئة
        function filterByCategory() {
            const category = document.getElementById('filterCategory').value;
            if (!category) {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.category === category);
                renderProducts(filtered);
            }
        }

        // تحديث الإحصائيات
        function updateStats() {
            const totalProducts = products.length;
            const totalValue = products.reduce((sum, p) => sum + (p.price * p.stock), 0);
            const avgPrice = totalProducts > 0 ? totalValue / totalProducts : 0;

            document.getElementById('totalProducts').textContent = totalProducts;
            document.getElementById('totalValue').textContent = totalValue.toFixed(2) + ' ر.س';
            document.getElementById('avgPrice').textContent = avgPrice.toFixed(2) + ' ر.س';
        }

        // حفظ في LocalStorage
        function saveProducts() {
            localStorage.setItem('products', JSON.stringify(products));
        }

        // تصدير البيانات
        function exportData() {
            const dataStr = JSON.stringify(products, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'products_' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('تم تصدير البيانات بنجاح!', 'success');
        }

        // Toast Notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.style.display = 'block';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // إغلاق الـ Modal عند النقر خارجها
        window.onclick = function(event) {
            const modal = document.getElementById('deleteModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
